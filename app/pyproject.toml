[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wikilocal"
version = "0.1.0"
description = "Local knowledge base for Feishu content."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28", "httpx2>=2.12", "ruff>=0.12"]
dev = ["ruff>=0.12"]
vector = ["lancedb>=0.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
